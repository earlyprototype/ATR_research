# CodeRabbit configuration.
#
# Added 2026-07-29: the EXP_010c-4 census commits one results JSON + one
# terminal tensor per measured window (554 files for 277 arms). These are
# experimental *data*, not code — they are the quantitative record, reviewed
# by the analysis scripts and the results tables, not line by line. Left
# unfiltered they push a PR past CodeRabbit's per-review file limit, which
# skips review of the ~8 files that actually warrant it (specs, runner,
# analysis, results record, session notes).
#
# Filters exclude generated run artifacts only. Everything that encodes a
# decision — specs, scripts, RESULTS/session markdown — stays reviewable.
#
# Scoped to the EXP_010c experiment tree on purpose (PR #51 review). A
# repo-wide `**/output/...` glob would silently un-review the artifacts of
# every future experiment, including ones whose JSON *is* decision-bearing.
# A new experiment that wants exclusions should add its own prefix here.
reviews:
  path_filters:
    - "!_STAGE2_JSPACE/experiments/exp_010c_windows/output/results_census/**"
    - "!_STAGE2_JSPACE/experiments/exp_010c_windows/output/terminals_census/**"
    - "!_STAGE2_JSPACE/experiments/exp_010c_windows/output/results_*.json"
    - "!_STAGE2_JSPACE/experiments/exp_010c_windows/output/terminals_*.pt"
    - "!_STAGE2_JSPACE/experiments/exp_010c_windows/output/terminal_characterisation_*.json"
    - "!_STAGE2_JSPACE/experiments/exp_010c_windows/output/prompt_subset.json"
